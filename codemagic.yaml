workflows:
  horas_daniel:
    name: Horas Daniel - APK de Teste
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Extrair projeto Android
        script: |
          rm -rf android_project
          mkdir -p android_project
          unzip -q project.zip -d android_project
      - name: Verificar projeto
        script: |
          cd android_project
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Projeto Android encontrado."
      - name: Compilar APK de teste
        script: |
          cd android_project
          gradle assembleDebug --no-daemon
    artifacts:
      - android_project/app/build/outputs/apk/debug/app-debug.apk
